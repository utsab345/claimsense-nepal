<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta
      name="description"
      content="ClaimSense Nepal — explainable motor insurance claims intelligence and investigation workspace."
    />
    <title>ClaimSense Nepal</title>
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem("claimsense.settings.v1") || "{}");
        if (stored.theme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#17191c");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
